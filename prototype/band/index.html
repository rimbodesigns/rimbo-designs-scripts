/* ---- HERO: the band ---- */
.band_hero { position: relative; height: 100svh; min-height: 36rem; overflow: hidden; background: var(--color--black); color: var(--color--rimbobage); }

.band_band { position: absolute; left: 50%; top: 50%; width: 250vw; --tilt-x: 0deg; --tilt-z: 0deg; transform: translate(-50%, -50%) translateY(10vw) rotateX(calc(56deg + var(--tilt-x))) rotateZ(calc(27deg + var(--tilt-z))); transform-style: flat; backface-visibility: hidden; display: grid; gap: 1.5vw; }

.band_panel-media { transition: filter .6s; }

.band_hero.is-dragging { user-select: none; }

.band_stage::before { top: 0; background: linear-gradient(var(--color--black), transparent); }

.band_copy { position: absolute; right: clamp(1.5rem, 5vw, 5rem); top: clamp(6rem, 15vh, 9rem); z-index: 2; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 1.1rem; max-width: 34rem; opacity: 0; transform: translateY(.8rem); transition: opacity 1s ease-out .35s, transform 1.4s cubic-bezier(.625, .05, 0, 1) .35s; }
